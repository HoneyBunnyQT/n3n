<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 174" width="808" height="174" role="img" aria-labelledby="title desc">
  <title id="title">The 128-bit pre-IV of header encryption</title>
  <desc id="desc">The checksum, exclusive-ored with the time stamp, its counter and flags, next to 32 pseudo-random bits.</desc>
  <!-- SPDX-License-Identifier: GPL-3.0-only -->
  <!-- SPDX-FileCopyrightText: Copyright Honey Bunny QT -->
  <!-- Generated by scripts/gen_doc_images.py: change it there -->
  <style>
    .box   { fill: #ffffff; stroke: #5c5c69; stroke-width: 1.2; }
    .hi    { fill: #fdf0f6; stroke: #c2185b; stroke-width: 1.2; }
    .opt   { fill: #f4f4f7; stroke: #9a9aa6; stroke-width: 1.2;
             stroke-dasharray: 5 3; }
    .open  { fill: #ffffff; stroke: #5c5c69; stroke-width: 1.2;
             stroke-dasharray: 5 3; }
    .nat   { fill: none; stroke: #9a9aa6; stroke-width: 1.2;
             stroke-dasharray: 5 4; }
    .wire  { stroke: #5c5c69; stroke-width: 2; fill: none; }
    .bar   { fill: #fdf0f6; stroke: #c2185b; stroke-width: 1.5; }
    .label { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1e1e24; }
    .title { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1e1e24; }
    .small { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5c5c69; }
    .xor   { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #c2185b; }
    @media (prefers-color-scheme: dark) {
      .box   { fill: #23232b; stroke: #a3a3ae; }
      .hi    { fill: #3a1f2c; stroke: #f06ba4; }
      .opt   { fill: #1b1b22; stroke: #6f6f7b; }
      .open  { fill: #23232b; stroke: #a3a3ae; }
      .nat   { stroke: #6f6f7b; }
      .wire  { stroke: #a3a3ae; }
      .bar   { fill: #3a1f2c; stroke: #f06ba4; }
      .label { fill: #ececf1; }
      .title { fill: #ececf1; }
      .small { fill: #a9a9b4; }
      .xor   { fill: #f06ba4; }
    }
  </style>

  <text class="small" x="20" y="24" text-anchor="middle">0</text>
  <text class="small" x="212" y="24" text-anchor="middle">32</text>
  <text class="small" x="404" y="24" text-anchor="middle">64</text>
  <text class="small" x="596" y="24" text-anchor="middle">96</text>
  <text class="small" x="785" y="24" text-anchor="middle">127</text>
  <rect class="hi" x="21" y="35" width="382" height="38" rx="3"/>
  <text class="label" x="212" y="58" text-anchor="middle">64-bit checksum of the whole packet</text>
  <rect class="box" x="405" y="35" width="190" height="38" rx="3"/>
  <text class="label" x="500" y="58" text-anchor="middle">0x00</text>
  <rect class="box" x="21" y="99" width="190" height="38" rx="3"/>
  <text class="label" x="116" y="122" text-anchor="middle">0x00</text>
  <rect class="hi" x="213" y="99" width="310" height="38" rx="3"/>
  <text class="label" x="368" y="122" text-anchor="middle">52-bit time stamp, µs</text>
  <rect class="box" x="525" y="99" width="46" height="38" rx="3"/>
  <text class="small" x="548" y="122" text-anchor="middle">counter</text>
  <rect class="box" x="573" y="99" width="22" height="38" rx="3"/>
  <text class="label" x="584" y="122" text-anchor="middle">F</text>
  <rect class="box" x="597" y="35" width="190" height="102" rx="3"/>
  <text class="label" x="692" y="83" text-anchor="middle">32 pseudo-</text>
  <text class="small" x="692" y="97" text-anchor="middle">random bits</text>
  <text class="xor" x="308" y="92" text-anchor="middle">XOR</text>
  <text class="small" x="404" y="164" text-anchor="middle">the two rows exclusive-ored, the random bits next to them: then one SPECK block step makes the IV</text>
</svg>
