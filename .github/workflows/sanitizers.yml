---
name: Sanitizers

# On every push: the tests with AddressSanitizer and UndefinedBehavior-
# Sanitizer built in, and every finding fatal - the unit and builtin
# tests, the integration tests and the netns scenarios (real NATs, real
# traffic, failovers, outages, reloads).  The "Code Analysers" job of
# tests.yml runs on pull requests, with UBSan only reporting.

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan_ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    env:
      SAN_FLAGS: >-
        -fsanitize=address,undefined -fno-sanitize-recover=all
        -fno-omit-frame-pointer -g -O1
      # the reports in files of their own: a daemon's log may be gone
      # before a leak report at its exit is written
      ASAN_OPTIONS: log_path=/tmp/san/asan:detect_leaks=1
      UBSAN_OPTIONS: log_path=/tmp/san/ubsan:print_stacktrace=1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Install essential
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          ./autogen.sh
          ./configure
          make build-dep

      - name: Build with the sanitizers
        run: |
          ./configure --enable-pthread \
            CFLAGS="$SAN_FLAGS" LDFLAGS="$SAN_FLAGS"
          make -j4 all
          mkdir -p /tmp/san

      - name: Unit and builtin tests
        run: |
          make test.units test.builtin

      - name: Integration tests
        run: |
          make test.integration

      - name: netns scenarios
        run: |
          # all but those tagged "limits", which fail on purpose; two at a
          # time, the sanitized daemons are slower
          sudo -E python3 tests/netns/run.py --skip-missing -j 2

      - name: No sanitizer reports
        if: ${{ always() }}
        run: |
          sudo chmod -R a+r /tmp/san
          if ls /tmp/san/* >/dev/null 2>&1; then
            head -n 60 /tmp/san/*
            exit 1
          fi

      - if: ${{ failure() }}
        name: Upload the reports and logs
        uses: actions/upload-artifact@v6
        with:
          name: sanitizers
          path: |
            /tmp/san
            tests

  tsan:
    name: TSan, the threads
    runs-on: ubuntu-latest
    env:
      SAN_FLAGS: -fsanitize=thread -g -O1
      TSAN_OPTIONS: log_path=/tmp/san/tsan

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Install essential
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2
          ./autogen.sh
          ./configure
          make build-dep
          # the address space randomisation of newer kernels is more than
          # TSan's memory layout takes
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Build with TSan
        run: |
          ./configure --enable-pthread \
            CFLAGS="$SAN_FLAGS" LDFLAGS="$SAN_FLAGS"
          make -j4 all
          mkdir -p /tmp/san

      - name: Unit and builtin tests
        run: |
          make test.units test.builtin

      - name: netns scenarios with threads
        run: |
          # the packet threads (daemon.threads), and the resolver thread
          # that every daemon has
          sudo -E python3 tests/netns/run.py --skip-missing -j 2 \
            @quick '*-threads'

      - name: No sanitizer reports
        if: ${{ always() }}
        run: |
          sudo chmod -R a+r /tmp/san
          if ls /tmp/san/* >/dev/null 2>&1; then
            head -n 60 /tmp/san/*
            exit 1
          fi

      - if: ${{ failure() }}
        name: Upload the reports and logs
        uses: actions/upload-artifact@v6
        with:
          name: tsan
          path: |
            /tmp/san
            tests
