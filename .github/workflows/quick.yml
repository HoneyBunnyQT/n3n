---
name: Quick Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoketest:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Run minimal test set
        run: |
          ./autogen.sh
          ./configure
          make -j4 all
          make test

      - if: ${{ failure() }}
        name: Upload tests output
        uses: actions/upload-artifact@v6
        with:
          name: tests-smoketest
          path: tests

  smoketest_all_opts:
    name: Smoke test With all options turned on
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Install libraries needed for all options turned on
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libminiupnpc-dev \
            libnatpmp-dev \
            libpcap-dev \
            libcap-dev \
            libzstd-dev

      - name: Run minimal test set
        run: |
          ./autogen.sh
          ./configure \
            --enable-pthread \
            --enable-miniupnp \
            --enable-natpmp \
            --enable-cap \
            --enable-pcap \
            --with-openssl \
            --with-zstd \
            CFLAGS="-O3 -fprofile-arcs -ftest-coverage"
            LDFLAGS="--coverage"
          make build-dep
          make -j4 all examples
          make test

      - name: Generate coverage reports
        run: |
          make gcov
          make cover COVERAGEDIR=coverage/ubuntu-22.04
        shell: bash

      - name: Upload gcovr report artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage

      - name: Upload data to codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  edge_only:
    name: Build with the edge only (--disable-relay)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build and run the tests that need no supernode
        run: |
          ./autogen.sh
          ./configure --disable-relay
          make -j4 all
          test ! -e apps/n3n-supernode
          make test.units test.builtin

  cross_qemu:
    name: Tests on ${{ matrix.host }} ${{ matrix.cflags }} under qemu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # big endian, 64 bit
          - host: s390x-linux-gnu
            arch: s390x
            qemu: qemu-s390x
          # big endian, 32 bit, no 64 bit atomics without libatomic, and
          # strict about alignment - as many routers
          - host: mips-linux-gnu
            arch: mips
            qemu: qemu-mips
          - host: aarch64-linux-gnu
            arch: arm64
            qemu: qemu-aarch64
          # the AES instructions of ARMv8 and Speck with NEON
          - host: aarch64-linux-gnu
            arch: arm64
            qemu: qemu-aarch64
            cflags: -march=armv8-a+crypto -DSPECK_ARM_NEON
          # 32 bit ARM with NEON
          - host: arm-linux-gnueabihf
            arch: armhf
            qemu: qemu-arm
            cflags: -mfpu=neon

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Install the cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-${{ matrix.host }} \
            libc6-dev-${{ matrix.arch }}-cross \
            qemu-user

      - name: Build
        run: |
          ./autogen.sh
          ./configure --host=${{ matrix.host }} \
              CFLAGS="-g -O2 ${{ matrix.cflags }}"
          make -j4 apps tools

      - name: Run the unit and builtin tests
        run: |
          scripts/test_qemu.sh ${{ matrix.qemu }} -L /usr/${{ matrix.host }}

  lint:
    name: Code syntax
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags


      - name: Make the makefiles
        run: |
          ./autogen.sh
          ./configure

      - name: Install essential
        run: |
          sudo apt update
          make build-dep

      # The C code is formatted as uncrustify 0.77.1 does it, see
      # docs/develop/linting.md; the distribution's version differs
      - name: Install uncrustify 0.77.1
        run: |
          git clone --depth 1 --branch uncrustify-0.77.1 \
              https://github.com/uncrustify/uncrustify.git /tmp/uncrustify
          cmake -S /tmp/uncrustify -B /tmp/uncrustify/build \
              -DCMAKE_BUILD_TYPE=Release
          make -C /tmp/uncrustify/build -j "$(nproc)"
          sudo cp /tmp/uncrustify/build/uncrustify /usr/local/bin/
          uncrustify --version

      - name: Run the lint tools
        run: |
          make lint
