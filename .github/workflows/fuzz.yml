---
name: Fuzz

# The fuzz targets of tests/fuzz, with libFuzzer, AddressSanitizer and
# UndefinedBehaviorSanitizer: a minute each on every push and pull
# request, a quick check that nothing in the diff crashes them.  The
# corpus a run grows is kept in the cache for the next one.
#
# The search that runs long, and the netns spray scenarios, are nightly
# in a private repository (its logs, with the seeds and inputs of what
# crashes, stay private until a fix is public), see that repo's
# .github/workflows/nightly.yml.  "make test" replays the regression
# corpus and the seeds on every build, sanitizers.yml with the
# sanitizers.
#
# A crash here is uploaded as fuzz-crash: the input, with libFuzzer's log
# and its seed.  Minimise it and put it into tests/fuzz/regress/, see
# tests/fuzz/README.md.

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer
    runs-on: ubuntu-24.04
    env:
      SAN_FLAGS: >-
        -fsanitize=fuzzer-no-link,address,undefined
        -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix Checkout
        run: |
          git fetch --force --tags

      - name: Build the targets with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev
          ./autogen.sh
          ./configure CC=clang CFLAGS="$SAN_FLAGS" LDFLAGS="$SAN_FLAGS"
          make -j4 fuzz FUZZ=libfuzzer
          tests/fuzz/fuzz-seeds tests/fuzz/seeds

      - name: The corpus of earlier runs
        uses: actions/cache@v6
        with:
          path: tests/fuzz/work
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: |
          rc=0
          for t in header transop wire tcp mgmt tun; do
            mkdir -p tests/fuzz/work/$t tests/fuzz/crash/$t
            # new inputs go to the first directory, the corpus kept; the
            # log has libFuzzer's seed ("INFO: Seed:") and what it found
            tests/fuzz/fuzz-$t -max_total_time=60 \
              -artifact_prefix=tests/fuzz/crash/$t/ \
              tests/fuzz/work/$t tests/fuzz/regress/$t tests/fuzz/seeds/$t \
              >tests/fuzz/crash/$t/fuzz.log 2>&1 || rc=1
            grep -h "INFO: Seed:\|DONE\|ERROR\|SUMMARY" \
              tests/fuzz/crash/$t/fuzz.log || true
          done
          exit $rc

      - if: ${{ failure() }}
        name: Upload what crashed, with the logs
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crash
          path: tests/fuzz/crash
